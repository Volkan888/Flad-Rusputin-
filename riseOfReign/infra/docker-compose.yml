services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riseofreign}
      POSTGRES_USER: ${POSTGRES_USER:-riseofreign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "5432:5432"
    volumes:
      - riseofreign_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riseofreign} -d ${POSTGRES_DB:-riseofreign}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ROR_EPOCH_1933_PATH: /app/content/1933
      ConnectionStrings__GameDb: Host=db;Port=5432;Database=${POSTGRES_DB:-riseofreign};Username=${POSTGRES_USER:-riseofreign};Password=${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  riseofreign_pgdata:
