name: Apply RiseOfReign Milestone 34A Payload

on:
  push:
    branches: [riseOfReign]
    paths:
      - 'riseOfReign/tools/m34a_payload.part*'
      - 'riseOfReign/tools/m34a_main.gd.correct'
      - '.github/workflows/apply-m34a-payload.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and apply Milestone 34A
        run: |
          set -euo pipefail
          cat riseOfReign/tools/m34a_payload.part* > /tmp/m34a_payload.b64
          base64 --decode /tmp/m34a_payload.b64 > /tmp/m34a_payload.zip
          set +e
          unzip -o /tmp/m34a_payload.zip -d .
          unzip_status=$?
          set -e
          if [ "$unzip_status" -gt 2 ]; then
            echo "Unzip failed with status $unzip_status"
            exit "$unzip_status"
          fi
          cp riseOfReign/tools/m34a_main.gd.correct riseOfReign/client/scripts/main.gd
          python -m json.tool riseOfReign/client/assets/events/flad_rasputin_prologue.json >/dev/null
          test -s riseOfReign/client/scenes/flad_prologue.tscn
          test -s riseOfReign/client/scripts/flad_prologue.gd
          test -s riseOfReign/client/assets/portraits/flad_rasputin.svg
          rm -f riseOfReign/tools/m34a_payload.part*
          rm -f riseOfReign/tools/m34a_main.gd.correct
          rm -rf tests/__pycache__
          rm -f .github/workflows/apply-m34a-payload.yml

      - name: Commit playable Flad Rasputin prologue
        run: |
          set -euo pipefail
          git config user.name "VK APPS Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "2026-09-02 19:52 CEST | milestone-34a | playable Flad Rasputin birth prologue events"
          git push origin HEAD:riseOfReign
