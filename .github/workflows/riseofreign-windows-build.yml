name: RiseOfReign Windows Playable Build

on:
  push:
    branches: [riseOfReign]
    paths:
      - 'riseOfReign/client/**'
      - 'riseOfReign/server/**'
      - 'riseOfReign/data/**'
      - '.github/workflows/riseofreign-windows-build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and export templates
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          godot --version

      - name: Export Godot Windows client
        run: |
          mkdir -p riseOfReign/client/build
          godot --headless --path riseOfReign/client --export-release "Windows Desktop" build/riseOfReign.exe
          test -f riseOfReign/client/build/riseOfReign.exe

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows API self-contained
        run: |
          dotnet publish riseOfReign/server/src/RiseOfReign.Api/RiseOfReign.Api.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o /tmp/ror-server

      - name: Assemble playable package with robust launcher
        run: |
          mkdir -p /tmp/ror-dist/server /tmp/ror-dist/data/epochs
          cp riseOfReign/client/build/riseOfReign.exe /tmp/ror-dist/
          cp -R /tmp/ror-server/* /tmp/ror-dist/server/
          cp -R riseOfReign/data/epochs/1933 /tmp/ror-dist/data/epochs/
          cat > /tmp/ror-dist/SPIEL_STARTEN.bat <<'BAT'
          @echo off
          setlocal
          title Rise of Reign - Launcher
          cd /d "%~dp0"
          set "ROR_EPOCH_1933_PATH=%~dp0data\epochs\1933"
          set "ASPNETCORE_URLS=http://127.0.0.1:8080"
          set "ASPNETCORE_ENVIRONMENT=Production"
          set "DOTNET_EnableDiagnostics=0"
          set "ROR_LAUNCH_DIR=%~dp0"
          set "ROR_SERVER_EXE=%~dp0server\RiseOfReign.Api.exe"
          set "ROR_SERVER_LOG=%~dp0server.log"
          set "ROR_SERVER_ERROR_LOG=%~dp0server-error.log"
          set "ROR_SERVER_PID_FILE=%~dp0server.pid"
          echo [1/3] Rise of Reign Server wird gestartet...
          del /q "%ROR_SERVER_LOG%" "%ROR_SERVER_ERROR_LOG%" "%ROR_SERVER_PID_FILE%" >nul 2>&1
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $p=Start-Process -FilePath $env:ROR_SERVER_EXE -WorkingDirectory $env:ROR_LAUNCH_DIR -WindowStyle Minimized -RedirectStandardOutput $env:ROR_SERVER_LOG -RedirectStandardError $env:ROR_SERVER_ERROR_LOG -PassThru; Set-Content -Path $env:ROR_SERVER_PID_FILE -Value $p.Id"
          if errorlevel 1 (
            echo FEHLER: Der lokale Server konnte nicht gestartet werden.
            pause
            exit /b 1
          )
          echo [2/3] Warte auf den lokalen Spielserver...
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='SilentlyContinue'; for($i=0;$i -lt 80;$i++){try{$null=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8080/health' -TimeoutSec 1; exit 0}catch{Start-Sleep -Milliseconds 250}}; exit 1"
          if errorlevel 1 (
            echo.
            echo FEHLER: Der lokale Server ist nicht erreichbar.
            echo Standardausgabe:
            if exist "%ROR_SERVER_LOG%" type "%ROR_SERVER_LOG%"
            echo Fehlerausgabe:
            if exist "%ROR_SERVER_ERROR_LOG%" type "%ROR_SERVER_ERROR_LOG%"
            if exist "%ROR_SERVER_PID_FILE%" for /f "usebackq" %%P in ("%ROR_SERVER_PID_FILE%") do taskkill /PID %%P /T /F >nul 2>&1
            pause
            exit /b 1
          )
          echo [3/3] Spiel wird geoeffnet...
          start "Rise of Reign" /wait "%~dp0riseOfReign.exe"
          if exist "%ROR_SERVER_PID_FILE%" (
            for /f "usebackq" %%P in ("%ROR_SERVER_PID_FILE%") do taskkill /PID %%P /T /F >nul 2>&1
            del /q "%ROR_SERVER_PID_FILE%" >nul 2>&1
          )
          endlocal
          BAT
          cp /tmp/ror-dist/SPIEL_STARTEN.bat /tmp/ror-dist/START_RISE_OF_REIGN.bat
          cat > /tmp/ror-dist/README_START.txt <<'TXT'
          RISE OF REIGN - WINDOWS PROTOTYP

          START:
          1. ZIP vollständig entpacken.
          2. SPIEL_STARTEN.bat doppelklicken.
          3. Nicht nur die Server-EXE öffnen.

          Der Launcher startet den lokalen Server, wartet auf den Health-Check und öffnet danach das Spiel.

          Enthalten:
          - VK APPS / Rise of Reign Intro
          - modernes Hauptmenü
          - Solo-Lernkampagne für einen Spieler
          - Schwierigkeitsgrad, historischer Modus und optionaler Timer
          - KI-Weltlage als deterministischer Direktor
          - bildliche Büro-, Karten-, Kommunikations-, Forschungs-, Archiv- und Meetingräume
          - anklickbare Maus-Hotspots und SVG-Icons
          - Wissenskarten und Fragen
          - Januar-1933-Spielschleife
          TXT

      - name: Upload playable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: riseOfReign-Windows-playable
          path: /tmp/ror-dist
          retention-days: 14
          compression-level: 6
