name: RiseOfReign Office CI

on:
  push:
    branches: [riseOfReign]
    paths:
      - 'riseOfReign/**'
      - 'tests/test_office_hubs.py'
      - 'tests/test_office_client.py'
      - 'tests/test_january_1933.py'
      - 'tests/test_sectors_1933.py'
      - '.github/workflows/riseofreign-office-ci.yml'
  pull_request:
    paths:
      - 'riseOfReign/**'
      - 'tests/test_office_hubs.py'
      - 'tests/test_office_client.py'
      - 'tests/test_january_1933.py'
      - 'tests/test_sectors_1933.py'
      - '.github/workflows/riseofreign-office-ci.yml'

jobs:
  office-content-client-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate office January and sector content
        run: python -m unittest -v tests/test_office_hubs.py tests/test_office_client.py tests/test_january_1933.py tests/test_sectors_1933.py

      - name: Install Godot 4.7.2 stable
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Parse Godot client headlessly
        run: godot --headless --path riseOfReign/client --editor --quit

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore riseOfReign/server/src/RiseOfReign.Api/RiseOfReign.Api.csproj

      - name: Build
        run: dotnet build riseOfReign/server/src/RiseOfReign.Api/RiseOfReign.Api.csproj -c Release --no-restore

      - name: Start API
        env:
          ROR_EPOCH_1933_PATH: ${{ github.workspace }}/riseOfReign/data/epochs/1933
          ASPNETCORE_URLS: http://127.0.0.1:5088
        run: |
          dotnet run --project riseOfReign/server/src/RiseOfReign.Api/RiseOfReign.Api.csproj -c Release --no-build > /tmp/riseofreign-api.log 2>&1 &
          echo $! > /tmp/riseofreign-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5088/health > /tmp/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/riseofreign-api.log
          exit 1

      - name: Smoke test office and January API
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          BASE = 'http://127.0.0.1:5088'
          AVATARS = ('ataturk','hitler','stalin','churchill','roosevelt','mussolini','custom')

          def get(path):
              with urllib.request.urlopen(BASE + path, timeout=5) as response:
                  return response.status, json.load(response)

          def post(path, payload):
              req = urllib.request.Request(
                  BASE + path,
                  data=json.dumps(payload).encode('utf-8'),
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req, timeout=5) as response:
                  return response.status, json.load(response)

          status, health = get('/health')
          assert status == 200
          assert health['status'] == 'ok', health
          assert health['mapContentLoaded'] is True, health
          assert health['officeContentLoaded'] is True, health
          assert health['januaryContentLoaded'] is True, health
          assert health['stateProfilesLoaded'] is True, health

          status, offices = get('/api/v1/offices')
          assert status == 200
          assert set(offices['interaction_types']) == {'side_menu', 'room', 'phone_list'}

          for avatar in AVATARS:
              status, office = get('/api/v1/offices/' + avatar)
              assert status == 200, avatar
              assert office['avatarId'] == avatar

              status, month = get('/api/v1/months/1933-01/' + avatar)
              assert status == 200, avatar
              assert month['avatar_id'] == avatar
              assert month['next_date'] == '1933-02-01'
              assert month['player_state']['finance']['monthly_income'] >= 0
              assert month['player_state']['health']['health'] >= 0
              assert month['player_state']['inventory_count'] > 0
              decision = month['decisions'][0]
              choice = decision['choices'][0]
              phone_category = month['phone_opportunities'][0]
              map_action = month['map_actions'][0]

              payload = {
                  'decision_choices': {decision['id']: choice['id']},
                  'phone_action': {'category': phone_category, 'option': 'ask_for_report'},
                  'map_action': map_action,
              }
              status, resolved = post('/api/v1/months/1933-01/' + avatar + '/resolve', payload)
              assert status == 200, (avatar, resolved)
              assert resolved['status'] == 'resolved', resolved
              assert resolved['next_date'] == '1933-02-01', resolved
              assert resolved['resulting_indicators'], resolved
              assert resolved['finance']['last_month_ledger']['month'] == '1933-01'
              assert resolved['health']['health'] >= 0
              assert len(resolved['inventory']) > 0

          status, hitler = get('/api/v1/months/1933-01/hitler')
          decision = hitler['decisions'][0]
          status, hitler_result = post('/api/v1/months/1933-01/hitler/resolve', {
              'decision_choices': {decision['id']: decision['choices'][0]['id']},
              'phone_action': {'category': hitler['phone_opportunities'][0], 'option': 'ask_for_report'},
              'map_action': hitler['map_actions'][0],
          })
          assert hitler_result['office_level'] == 1, hitler_result
          assert any(x['type'] == 'historical_anchor' and x['id'] == 'de_1933_hitler_chancellor' for x in hitler_result['applied_actions'])

          try:
              post('/api/v1/months/1933-01/ataturk/resolve', {
                  'decision_choices': {},
                  'phone_action': {'category': 'cabinet', 'option': 'ask_for_report'},
                  'map_action': 'inspect_resources',
              })
              raise AssertionError('Missing required decision should return 400')
          except urllib.error.HTTPError as exc:
              assert exc.code == 400, exc.code
          PY

      - name: Show API log on failure
        if: failure()
        run: cat /tmp/riseofreign-api.log || true

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/riseofreign-api.pid ]; then
            kill "$(cat /tmp/riseofreign-api.pid)" || true
          fi
